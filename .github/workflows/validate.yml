name: Validate community files

on: [push, pull_request]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install check-jsonschema==0.38.2
      - run: python -m unittest discover -s tests -v
      - run: check-jsonschema --builtin-schema vendor.github-issue-forms .github/ISSUE_TEMPLATE/{bug,feature,chore,docs}.yml
      - run: check-jsonschema --builtin-schema vendor.github-issue-config .github/ISSUE_TEMPLATE/config.yml
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
